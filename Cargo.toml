[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
uuid = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

# The link code's tests run thousands of X25519 and ristretto255 operations
# (HOS-05 alone makes about a thousand connections); unoptimised, the curve
# arithmetic makes them take half a minute instead of a second, in every
# test run and under every mutant. Only this dependency is optimised; the
# workspace's own crates keep the dev profile.
[profile.dev.package.curve25519-dalek]
opt-level = 3
