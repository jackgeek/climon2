[project]
name = "climon2-factory"
version = "0.1.0"
description = "Software factory that builds climon2"
readme = "README.md"
authors = [
    { name = 'Brodie "Jack" Allan', email = "jackgeek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-github-copilot>=2.1.0",
]

[project.scripts]
factory = "climon2_factory.wiring:entry"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "fixtures"]
addopts = "-m 'not container and not github and not macos and not copilot and not windows_vm'"
markers = [
    "container: needs a running dockerd (Rancher Desktop); run with -m container",
    "github: pushes to jackgeek/climon2 and runs real Windows CI; run with -m github",
    "macos: runs acceptance tests natively on this Mac; run with -m macos",
    "windows_vm: runs acceptance tests in the local VirtualBox Windows VM; run with -m windows_vm",
    "copilot: runs real GitHub Copilot agents (uses premium requests); run with -m copilot",
]

[tool.ruff]
line-length = 100
