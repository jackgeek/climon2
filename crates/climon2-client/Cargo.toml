[package]
name = "climon2-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The cdylib is libclimon2_client.dylib; `lib` keeps the rlib for the binary and tests.
[lib]
crate-type = ["lib", "cdylib"]

[features]
test-hooks = []

[dependencies]
climon2-core = { path = "../climon2-core" }
climon2-platform = { path = "../climon2-platform" }
libc = "0.2.191"
tracing = "0.1.44"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
climon2-test-term = { path = "../climon2-test-term" }

[lints]
workspace = true
