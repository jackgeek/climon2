[package]
name = "climon2-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
climon2-core = { path = "../climon2-core" }
climon2-discovery = { path = "../climon2-discovery" }
climon2-platform = { path = "../climon2-platform" }
climon2-vt = { path = "../climon2-vt" }
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Only to paint SGR 58 underline colours; `ratatui/underline-color` would also
# lock every optional backend.
ratatui-core = { version = "0.1.2", default-features = false, features = ["underline-color"] }
tracing = "0.1.44"
unicode-width = "0.2.3"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
