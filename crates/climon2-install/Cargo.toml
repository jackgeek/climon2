[package]
name = "climon2-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
climon2-core = { path = "../climon2-core" }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.191"

# The user PATH lives in the registry, and a change to it is broadcast.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# The Windows tests run the test binary itself as the installer, under a
# registry key of their own, and as programs an install finds running.
[target.'cfg(windows)'.dev-dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "windows"
path = "tests/windows.rs"
harness = false
