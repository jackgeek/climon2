[package]
name = "climon2-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
base64 = "0.22.1"
climon2-core = { path = "../climon2-core" }
climon2-platform = { path = "../climon2-platform" }
climon2-vt = { path = "../climon2-vt" }
tracing = "0.1.44"
uuid = { workspace = true, features = ["v4"] }

# The Unix PTY; Windows uses the bundled ConPTY through climon2-platform.
[target.'cfg(unix)'.dependencies]
portable-pty = { version = "0.9.0", default-features = false }

[dev-dependencies]
libc = "0.2.191"
# The harness's hosted commands, which the Windows tests build.
portable-pty = { version = "0.9.0", default-features = false }
serde_json.workspace = true
tempfile = "3.27.0"
vt100 = "0.18.1"
climon2-test-term = { path = "../climon2-test-term" }

[lints]
workspace = true
