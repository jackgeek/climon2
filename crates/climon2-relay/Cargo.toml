[package]
name = "climon2-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
climon2-core = { path = "../climon2-core" }
climon2-link = { path = "../climon2-link" }
climon2-platform = { path = "../climon2-platform" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

# The relay runs on macOS and Linux, and so does the terminal that drives it.
[target.'cfg(unix)'.dev-dependencies]
climon2-test-term = { path = "../climon2-test-term" }
nix = { version = "0.31", features = ["signal"] }

[lints]
workspace = true
