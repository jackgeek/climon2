[package]
name = "climon2-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
climon2-core = { path = "../climon2-core" }
climon2-discovery = { path = "../climon2-discovery" }
climon2-platform = { path = "../climon2-platform" }
tracing = "0.1.44"
uuid = { workspace = true, features = ["v4"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "local-offset"] }
unicode-width = "0.2.3"

[dev-dependencies]
libc = "0.2.191"
tempfile = "3.27.0"
filetime = "0.2.27"
portable-pty = { version = "0.9.0", default-features = false }
climon2-test-term = { path = "../climon2-test-term" }

[lints]
workspace = true

# The Windows exec tests check the daemon's job and end daemons left running.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
