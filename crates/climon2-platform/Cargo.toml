[package]
name = "climon2-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
climon2-core = { path = "../climon2-core" }
libc = "0.2.191"
signal-hook = "0.3.18"
socket2 = "0.6.5"
time = { workspace = true, features = ["formatting", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
filetime = "0.2.29"
serde_json.workspace = true
tempfile = "3.27.0"

# The fixtures are Unix programs; only the home tests run on Windows so far.
[target.'cfg(unix)'.dev-dependencies]
climon2-fixtures = { path = "../climon2-fixtures" }

# The pinned ConPTY the Windows PTY and console tests host their programs in.
[target.'cfg(windows)'.dev-dependencies]
climon2-test-term = { path = "../climon2-test-term" }
portable-pty = { version = "0.9.0", default-features = false }

[target.'cfg(windows)'.dependencies]
time = { workspace = true, features = ["local-offset"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
