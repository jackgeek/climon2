[package]
name = "climon2-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
climon2-core = { path = "../climon2-core" }
climon2-fixtures = { path = "../climon2-fixtures" }
climon2-install = { path = "../climon2-install" }
# Only for the link peer stand-in, which speaks the link's bytes (#501).
climon2-link = { path = "../climon2-link" }
# Only so that Cargo builds the second-release fixture's library (#97).
climon2-second-release = { path = "../climon2-second-release" }
climon2-test-term = { path = "../climon2-test-term" }
libc = "0.2.191"
nix = { version = "0.31", features = ["fs", "signal", "process", "user"] }
portable-pty = { version = "0.9.0", default-features = false }
serde_json.workspace = true
# Only to work out key fingerprints independently of the link code (#501).
sha2.workspace = true
tempfile = "3"
