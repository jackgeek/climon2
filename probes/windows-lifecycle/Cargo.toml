[package]
name = "windows-lifecycle-probes"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway measuring code for issue #300. Deliberately outside the workspace.
[workspace]

[[bin]]
name = "probe"
path = "src/main.rs"

# Same program with a longPathAware manifest embedded (S7).
[[bin]]
name = "probe-lpa"
path = "src/main.rs"

[[bin]]
name = "needs-dll"
path = "src/bin/needs_dll.rs"

[dependencies]
serde_json = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_RemoteDesktop",
  "Win32_System_Time",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
