[package]
name = "monitor-selector-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
rust-fuzzy-search = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json_lenient = "0.2"

[dev-dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = { version = "0.9.0", default-features = false }
tempfile = "3"
