name: Probe flaky disconnect prefix (#350, not for merge)

on:
  push:
    branches: [probe/flaky-disconnect-prefix]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        # Where cargo test runs the e2e test binaries.
        working-directory: crates/climon2-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-24.04
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev shellcheck vim less
      - uses: ./.github/actions/controlled-bash
      - name: Build workspace tests
        run: |
          cargo test --locked --workspace --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="monitor" and .profile.test) | .executable' \
            > monitor-path
          cat monitor-path
      - name: Old wait with Gone already Unavailable (expected to fail)
        run: |
          set +e
          "$(cat monitor-path)" --exact probe_old_wait_with_gone_unavailable
          echo "exit=$?"
      - name: New wait with Gone already Unavailable (expected to pass)
        run: '"$(cat monitor-path)" --exact probe_new_wait_with_gone_unavailable'
      - name: Fixed tests repeated, eight at a time
        run: |
          monitor="$(cat monitor-path)"
          mkdir -p runs
          run() {
            "$monitor" --exact "$1" > "runs/$1-$2.log" 2>&1 && echo pass || { echo "FAIL $1 $2"; tail -40 "runs/$1-$2.log"; }
          }
          export -f run
          export monitor
          { seq 1 200 | sed 's/^/a_disconnect_discards_a_pending_prefix /'
            seq 1 40 | sed 's/^/a_failed_acquisition_keeps_the_selection_and_redirects_no_input /'
          } | xargs -P 8 -L 1 bash -c 'run "$0" "$1"' > results.txt
          grep -A40 FAIL results.txt || true
          echo "passes: $(grep -c '^pass$' results.txt), failures: $(grep -c '^FAIL' results.txt)"
          ! grep -q '^FAIL' results.txt
