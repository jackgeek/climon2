name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      mutate_all:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.runner }} / bash 5
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the advertised architecture
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          expected=arm64
          if [[ "$RUNNER_LABEL" != macos-15 ]]; then expected=x86_64; fi
          test "$(uname -m)" = "$expected"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install ShellCheck
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang libclang-dev shellcheck vim less
          else
            brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          fi
      - uses: ./.github/actions/controlled-bash
      - name: Check native interface specification declarations and examples
        run: python3 docs/protocol/monitor-client/check.py
      - name: Run formatting, lint and real-terminal tests
        run: cargo xtask test
  neutral:
    name: Platform-neutral / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test neutral contracts
        run: cargo test --locked -p climon2-core
      - name: Test Unix launcher
        if: runner.os == 'Linux'
        run: cargo test --locked -p climon2-launcher
  quality:
    name: Coverage and isolated mutation checks / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: target/quality-run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require native architecture and install test prerequisites
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(uname -m)" = x86_64
            sudo apt-get update -qq
            sudo apt-get install -y clang libclang-dev shellcheck vim less
          else
            test "$(uname -m)" = arm64
            brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          fi
      - uses: ./.github/actions/controlled-bash
      - name: Select the changed-source mutation base (fixture history is checked independently)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=HEAD
          fi
          echo "CLIMON2_MUTATION_BASE=$base" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .metrics
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs', 'tools/quality-requirements.txt') }}
      - name: Set up pinned quality tools
        run: cargo xtask setup-quality
      - name: Run local-equivalent full quality gates
        env:
          MUTATE_ALL: ${{ inputs.mutate_all || false }}
        run: |
          if [[ "$MUTATE_ALL" == true ]]; then
            cargo xtask check --mutate-all
          else
            cargo xtask check
          fi
  dist:
    name: Release artifact / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-universal
          - runner: ubuntu-24.04
            platform: linux-x86_64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require native architecture and install target slices
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(uname -m)" = x86_64
            sudo apt-get update -qq
            sudo apt-get install -y clang libclang-dev
            rustup target add x86_64-unknown-linux-gnu
          else
            test "$(uname -m)" = arm64
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Build and verify the release artifact
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error
  archive:
    name: Final archive / ${{ matrix.runner }} / bash 5
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-universal
          - runner: macos-15-intel
            platform: macos-universal
          - runner: ubuntu-24.04
            platform: linux-x86_64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ matrix.platform }}
          path: target/dist
      - name: Require the advertised architecture
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          expected=arm64
          if [[ "$RUNNER_LABEL" != macos-15 ]]; then expected=x86_64; fi
          test "$(uname -m)" = "$expected"
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev vim less
      - uses: ./.github/actions/controlled-bash
      - name: Verify the exact downloaded artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd target/dist
          if [[ "$RUNNER_OS" == Linux ]]; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$(sed -n 's/^VERSION='"'"'\([^'"'"']*\)'"'"'$/\1/p' install.sh)"
          fi
          archive="$PWD/climon2-$version-$PLATFORM.tar.gz"
          test -f "$archive"
          echo "CLIMON2_E2E_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Install-script smoke with this exact archive
        run: |
          version="$(sed -n 's/^VERSION='"'"'\([^'"'"']*\)'"'"'$/\1/p' target/dist/install.sh)"
          releases="$PWD/target/script-smoke/releases"
          assets="$releases/v$version"
          mkdir -p "$assets"
          cp target/dist/* "$assets/"
          CLIMON2_RELEASE_BASE_URL="file://$releases" \
            bash target/dist/install.sh --dir "$PWD/target/script-smoke/installed"
          target/script-smoke/installed/climon2 --version
      - name: Obtain the actual previous release when one exists
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          previous=
          while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$GITHUB_REF_NAME" ]]; then
              assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
              if grep -q -- "-$PLATFORM.tar.gz$" <<< "$assets"; then
                previous="$tag"
                break
              fi
            fi
          done <<< "$tags"
          if [[ -n "$previous" ]]; then
            destination="$RUNNER_TEMP/climon2-previous"
            mkdir -p "$destination"
            gh release download "$previous" --pattern "climon2-*-$PLATFORM.tar.gz" --dir "$destination"
            archives=("$destination"/climon2-*-"$PLATFORM".tar.gz)
            test "${#archives[@]}" = 1
            test -f "${archives[0]}"
            echo "CLIMON2_E2E_PREVIOUS_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"
          else
            echo "First $PLATFORM release: no previous platform archive exists; no synthetic compatibility fixture."
          fi
      - name: Build test harnesses and debug siblings without substituting archive binaries
        run: cargo test --workspace --locked --no-run
      - name: Test this exact archive including smoke, vim and less
        run: cargo test -p climon2-e2e --locked
