name: Checks

# Documentation-only changes skip checks, except protocol pages: core's tests
# read their published examples. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "docs/for-humans/protocol/**/*.md"
  pull_request:
    # ready_for_review re-runs checks when a draft integration PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "docs/for-humans/protocol/**/*.md"
  workflow_call:
    inputs:
      mutate_all:
        type: boolean
        default: false

permissions:
  contents: read

# macOS test jobs run only while the repository variable CLIMON2_MACOS_TESTS is
# "on" (Settings > Secrets and variables > Actions > Variables). Off, checks run
# on Linux and Windows, and macOS only builds its release artifact.
#
# The Windows Test, Quality and Archive jobs run unless the repository variable
# CLIMON2_WINDOWS_TESTS is "off" (docs/for-humans/windows/quality.md). Off, they still run
# for release tags and for changes that `cargo xtask windows-changed` says
# touch Windows-only code. The neutral job's Windows leg and the Windows Dist
# job always run.
#
# While Windows support is being built, the Windows Quality job (CRAP and
# mutation) runs on pull requests and main only when the repository variable
# CLIMON2_WINDOWS_QUALITY is "on"; developers run the same gate on the Windows
# development VM instead (docs/for-humans/windows/quality.md, "Running the gate
# locally"). Release qualification always runs it.

# A newer push to the same pull request supersedes its in-progress checks.
# Main pushes and release calls get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-pr-{0}', github.event.pull_request.number) || format('checks-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.runner }} / bash 5
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(vars.CLIMON2_MACOS_TESTS == 'on' && '["macos-15", "macos-15-intel", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the advertised architecture
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          expected=arm64
          if [[ "$RUNNER_LABEL" != macos-15 ]]; then expected=x86_64; fi
          test "$(uname -m)" = "$expected"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - name: Install universal payload targets for install tests
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install ShellCheck
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang libclang-dev shellcheck vim less
          else
            brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          fi
      - uses: ./.github/actions/controlled-bash
      - name: Check native interface specification declarations and examples
        run: python3 docs/for-humans/protocol/monitor-client/check.py
      - name: Run formatting, lint and real-terminal tests
        run: |
          cargo xtask fixtures-check
          cargo xtask test
  neutral:
    name: Platform-neutral / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Test neutral contracts
        run: cargo test --locked -p climon2-core
      - name: Test Unix launcher
        if: runner.os == 'Linux'
        run: cargo test --locked -p climon2-launcher
  windows-scope:
    name: Windows scope
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.scope.outputs.test }}
    env:
      SWITCH: ${{ vars.CLIMON2_WINDOWS_TESTS }}
      REF_TYPE: ${{ github.ref_type }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        if: env.SWITCH == 'off' && env.REF_TYPE != 'tag'
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [[ "$SWITCH" != off || "$REF_TYPE" == tag \
            || -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo test=true >> "$GITHUB_OUTPUT"
          else
            echo "test=$(cargo xtask windows-changed "$BASE")" >> "$GITHUB_OUTPUT"
          fi
  # The smoke test runs against the zip the Dist job built, so this job waits
  # for it (docs/for-humans/windows/quality.md, "Pull request jobs").
  windows-test:
    name: Windows test / windows-2025
    needs: [windows-scope, windows-dist]
    if: needs.windows-scope.outputs.test == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2025-test
      # The cross-account test logs on as a second, non-administrator account
      # (docs/for-humans/windows/quality.md, "Facts only CI can show"); it fails on CI
      # without one.
      - name: Create the second account the cross-account test logs on as
        shell: powershell
        run: |
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = 'Aa1!' + (($bytes | ForEach-Object { $_.ToString('x2') }) -join '')
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name c2second -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member c2second
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CLIMON2_SECOND_ACCOUNT=c2second`nCLIMON2_SECOND_ACCOUNT_PASSWORD=$password`n")
      # Every workspace test that builds on Windows so far: the other crates
      # and climon2-platform's Unix seams stop at compile_error! until their
      # Windows arms exist.
      - name: Test the neutral crates
        run: cargo test --locked -p climon2-core -p climon2-vt
      # The harness fetches the pinned ConPTY package itself and verifies it
      # against pins/conpty.txt; the cache only saves the download.
      - uses: actions/cache@v4
        with:
          path: target/conpty
          key: conpty-${{ hashFiles('pins/conpty.txt') }}
      # The same for the pinned full-screen apps, vim and Microsoft Edit,
      # against pins/vim.txt and pins/edit.txt.
      - uses: actions/cache@v4
        with:
          path: target/apps
          key: apps-${{ hashFiles('pins/vim.txt', 'pins/edit.txt') }}
      - name: Test the platform seams that build on Windows
        run: cargo test --locked -p climon2-platform --lib --test home_windows --test private_windows --test cross_account_windows --test presentation_windows --test connection_windows --test runtime_windows --test process_windows --test pty_windows --test command_windows --test notifier_windows --test native_path_windows --test terminal_windows --test handoff_windows
      - name: Test the harness's Windows host
        run: cargo test --locked -p climon2-test-term
      # Also builds the daemon binary, which the CLI's exec tests start.
      - name: Test the daemon binary's Windows answers
        run: cargo test --locked -p climon2-daemon --test windows
      # Also builds the client binary and its library, which the CLI's attach,
      # kill and smoke tests start.
      - name: Test the client library on Windows
        run: cargo test --locked -p climon2-client --test library_windows
      # Also builds the monitor binary, which the CLI's monitor tests start.
      - name: Test the monitor on Windows
        run: cargo test --locked -p climon2-monitor
      # Native revision 1 under the Microsoft x64 convention.
      - name: Check native interface declarations and examples with MSVC
        run: python -I docs/for-humans/protocol/monitor-client/check.py NativeDeclarations.test_msvc_declarations_and_examples
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-windows-x86_64-msvc
          path: target/dist-artifact
      # The smoke test (packaged_windows.rs) installs the product from the zip.
      - name: Test the launcher, the CLI's Windows answers, exec, attach, kill, the monitor and the smoke test
        shell: bash
        run: |
          CLIMON2_E2E_ARCHIVE="$(cygpath -aw "$(ls target/dist-artifact/*.zip)")"
          export CLIMON2_E2E_ARCHIVE
          cargo test --locked -p climon2-launcher -p climon2-cli
      # Without CLIMON2_E2E_ARCHIVE the archive tests pass without running;
      # the Windows Archive job runs them.
      - name: Test the installer
        run: cargo test --locked -p climon2-install
  windows-quality:
    name: Windows-only CRAP and mutation / windows-2025
    needs: windows-scope
    # As the macOS job: a draft feature/* -> main integration PR waits until ready.
    # Off by default during development (see the top of this file); release
    # qualification (mutate_all) and tags always run it.
    if: >-
      needs.windows-scope.outputs.test == 'true'
      && (vars.CLIMON2_WINDOWS_QUALITY == 'on'
        || inputs.mutate_all
        || startsWith(github.ref, 'refs/tags/'))
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.draft
        && github.base_ref == 'main'
        && startsWith(github.head_ref, 'feature/'))
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: target/quality-run
      # One verified ConPTY download for every coverage and mutation build.
      CLIMON2_TEST_CONPTY_CACHE: ${{ github.workspace }}/target/conpty
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Select the changed-source mutation base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=HEAD
          fi
          echo "CLIMON2_MUTATION_BASE=$base" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .metrics
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs', 'tools/quality-requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov.exe
          key: llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs') }}
      - name: Set up pinned quality tools
        env:
          CLIMON2_QUALITY_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo xtask setup-quality
      # The cross-account test logs on as a second, non-administrator account
      # (docs/for-humans/windows/quality.md, "Facts only CI can show"); it fails on CI
      # without one.
      - name: Create the second account the cross-account test logs on as
        shell: powershell
        run: |
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = 'Aa1!' + (($bytes | ForEach-Object { $_.ToString('x2') }) -join '')
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name c2second -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member c2second
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CLIMON2_SECOND_ACCOUNT=c2second`nCLIMON2_SECOND_ACCOUNT_PASSWORD=$password`n")
      # On Windows the gate first runs the sentinel and the killed-process coverage
      # probe. A release mutates every registered Windows file; its time is recorded
      # against the 90-minute budget in docs/for-humans/windows/quality.md.
      - name: Qualify only Windows-exclusive source (shared source runs on Linux)
        env:
          MUTATE_ALL: ${{ inputs.mutate_all || false }}
        run: |
          flags=(--native-only)
          if [[ "$MUTATE_ALL" == true ]]; then flags+=(--mutate-all); fi
          started=$SECONDS
          status=0
          cargo xtask mutate "${flags[@]}" || status=$?
          minutes=$(( (SECONDS - started + 59) / 60 ))
          {
            echo "### Windows native-only gate"
            echo
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}; $(cmd //c ver | tr -d '\r' | grep .)"
            echo "- \`cargo xtask mutate ${flags[*]}\`: exit $status after $minutes min"
            if [[ "$MUTATE_ALL" == true ]]; then
              verdict=within
              if (( minutes > 90 )); then verdict=over; fi
              echo "- Release mutate-all: $minutes of 90 budgeted minutes ($verdict budget)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  quality:
    name: macOS-only CRAP and mutation
    # A draft feature/* -> main integration PR re-qualifies every macOS change
    # since main on each update, though each ticket PR already qualified its
    # own. Run it once the integration PR is marked ready, and on every update after.
    if: >-
      vars.CLIMON2_MACOS_TESTS == 'on'
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.draft
        && github.base_ref == 'main'
        && startsWith(github.head_ref, 'feature/'))
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: target/quality-run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require native architecture and install test prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
      # Qualifying changed macOS-only source runs every workspace test under
      # coverage, including xtask's install tests, which build both slices.
      - name: Install universal payload targets for install tests
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: ./.github/actions/controlled-bash
      - name: Select the changed-source mutation base (fixture history is checked independently)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=HEAD
          fi
          echo "CLIMON2_MUTATION_BASE=$base" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .metrics
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs', 'tools/quality-requirements.txt') }}
      # The pinned cargo-llvm-cov (LLVM_COV in xtask/src/quality.rs) takes a
      # minute or more to build; setup-quality installs it only when missing.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs') }}
      - name: Set up pinned quality tools
        run: cargo xtask setup-quality
      - name: Qualify only macOS-exclusive source (shared and Linux run locally)
        env:
          MUTATE_ALL: ${{ inputs.mutate_all || false }}
        run: |
          if [[ "$MUTATE_ALL" == true ]]; then
            cargo xtask mutate --native-only --mutate-all
          else
            cargo xtask mutate --native-only
          fi
  dist:
    name: Release artifact / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-universal
          - runner: ubuntu-24.04
            platform: linux-x86_64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.platform }}
      - name: Require native architecture and install target slices
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(uname -m)" = x86_64
            sudo apt-get update -qq
            sudo apt-get install -y clang libclang-dev
            rustup target add x86_64-unknown-linux-gnu
          else
            test "$(uname -m)" = arm64
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Build and verify the release artifact
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error
  # The Windows release zip (docs/for-humans/windows/distribution.md). It runs on every run,
  # whatever CLIMON2_WINDOWS_TESTS says (docs/for-humans/windows/quality.md, "The switch"),
  # and tests the dist's own checks first. Publishing the zip comes with #330.
  windows-dist:
    name: Windows dist / windows-2025
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-windows-x86_64-msvc
      - name: Require native architecture
        run: test "$PROCESSOR_ARCHITECTURE" = AMD64
      - name: Test the Windows dist, its PE checks and this job
        run: |
          cargo test --locked -p xtask --bin xtask -- pe:: dist::
          cargo test --locked -p xtask --test dist --test workflows
      - name: Build and verify the Windows release zip
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-windows-x86_64-msvc
          path: target/dist/*
          if-no-files-found: error
  # The Windows archive's end-to-end tests on the exact zip the Windows Dist job
  # built (docs/for-humans/windows/quality.md, "Pull request jobs"): its install.exe, and
  # install.ps1 under Windows PowerShell 5.1 and PowerShell 7. The runner is
  # thrown away afterwards, so these tests may change the real user PATH; they
  # put it back.
  windows-archive:
    name: Windows archive / windows-2025
    needs: [windows-scope, windows-dist]
    if: needs.windows-scope.outputs.test == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # Restore the Rust cache before downloading the archive: a partial-match
      # restore cleans target/, which would delete target/dist.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2025-archive
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-windows-x86_64-msvc
          path: target/dist
      - name: Verify the exact downloaded artifact
        run: |
          cd target/dist
          sha256sum -c SHA256SUMS
          archives=(climon2-*-windows-x86_64-msvc.zip)
          test "${#archives[@]}" = 1
          test -f "${archives[0]}"
          test -f install.ps1
          echo "CLIMON2_E2E_ARCHIVE=$(cygpath -w "$PWD/${archives[0]}")" >> "$GITHUB_ENV"
      - name: Test this exact archive, its installer and install.ps1 under both PowerShells
        env:
          CLIMON2_E2E_REAL_USER_PATH: "1"
        run: |
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          cargo test --locked -p climon2-install --test archive_windows
  archive:
    name: Final archive / ${{ matrix.runner }} / bash 5
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(vars.CLIMON2_MACOS_TESTS == 'on' && '[{"runner": "macos-15", "platform": "macos-universal"}, {"runner": "macos-15-intel", "platform": "macos-universal"}, {"runner": "ubuntu-24.04", "platform": "linux-x86_64-gnu"}]' || '[{"runner": "ubuntu-24.04", "platform": "linux-x86_64-gnu"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Restore the Rust cache before downloading the archive: a partial-match
      # restore cleans target/, which would delete target/dist.
      - uses: Swatinem/rust-cache@v2
        with:
          key: archive-${{ matrix.runner }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ matrix.platform }}
          path: target/dist
      - name: Require the advertised architecture
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          expected=arm64
          if [[ "$RUNNER_LABEL" != macos-15 ]]; then expected=x86_64; fi
          test "$(uname -m)" = "$expected"
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev vim less
      - uses: ./.github/actions/controlled-bash
      - name: Verify the exact downloaded artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd target/dist
          if [[ "$RUNNER_OS" == Linux ]]; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$(sed -n 's/^VERSION='"'"'\([^'"'"']*\)'"'"'$/\1/p' install.sh)"
          fi
          archive="$PWD/climon2-$version-$PLATFORM.tar.gz"
          test -f "$archive"
          echo "CLIMON2_E2E_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Install-script smoke with this exact archive
        run: |
          version="$(sed -n 's/^VERSION='"'"'\([^'"'"']*\)'"'"'$/\1/p' target/dist/install.sh)"
          releases="$PWD/target/script-smoke/releases"
          assets="$releases/v$version"
          home="$PWD/target/script-smoke/home"
          downloads="$PWD/target/script-smoke/downloads"
          mkdir -p "$assets" "$home" "$downloads"
          cp target/dist/* "$assets/"
          HOME="$home" TMPDIR="$downloads" CLIMON2_RELEASE_BASE_URL="file://$releases" \
            /bin/bash target/dist/install.sh
          "$home/.local/share/climon2/c2" --version
      - name: Obtain the actual previous release when one exists
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          previous=
          while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$GITHUB_REF_NAME" ]]; then
              assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
              if grep -q -- "-$PLATFORM.tar.gz$" <<< "$assets"; then
                previous="$tag"
                break
              fi
            fi
          done <<< "$tags"
          if [[ -n "$previous" ]]; then
            destination="$RUNNER_TEMP/climon2-previous"
            mkdir -p "$destination"
            gh release download "$previous" --pattern "climon2-*-$PLATFORM.tar.gz" --dir "$destination"
            archives=("$destination"/climon2-*-"$PLATFORM".tar.gz)
            test "${#archives[@]}" = 1
            test -f "${archives[0]}"
            echo "CLIMON2_E2E_PREVIOUS_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"
          else
            echo "First $PLATFORM release: no previous platform archive exists; no synthetic compatibility fixture."
          fi
      - name: Build test harnesses and debug siblings without substituting archive binaries
        run: cargo test --workspace --locked --no-run
      - name: Test this exact archive including smoke, vim and less
        run: cargo test -p climon2-e2e --locked
