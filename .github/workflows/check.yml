name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.runner }} / bash ${{ matrix.bash }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        bash: ["3.2", "5"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Select required bash
        env:
          BASH_PROFILE: ${{ matrix.bash }}
        run: |
          if [[ "$BASH_PROFILE" == "3.2" ]]; then
            bash_path=/bin/bash
          else
            brew list bash >/dev/null 2>&1 || brew install bash
            bash_path="$(brew --prefix bash)/bin/bash"
          fi
          test -x "$bash_path"
          actual="$("$bash_path" -c 'printf "%s" "$BASH_VERSION"')"
          case "$actual" in
            "$BASH_PROFILE".*) ;;
            *) echo "::error::Expected bash $BASH_PROFILE, found $actual"; exit 1 ;;
          esac
          echo "CLIMON2_TEST_BASH=$bash_path" >> "$GITHUB_ENV"
      - name: Run formatting, lint and real-terminal tests
        run: cargo xtask test
  neutral:
    name: Platform-neutral / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test neutral contracts
        run: cargo test --locked -p climon2-core
      - name: Test Unix launcher
        if: runner.os == 'Linux'
        run: cargo test --locked -p climon2-launcher
  quality:
    name: Coverage and isolated mutation checks
    runs-on: macos-15
    env:
      CLIMON2_TEST_BASH: /bin/bash
      CLIMON2_MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: .metrics
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/src/quality.rs', 'tools/quality-requirements.txt') }}
      - name: Set up pinned quality tools
        run: cargo xtask setup-quality
      - name: Prove real-binary worker isolation
        run: cargo xtask mutation-probe
      - name: Prove staged coverage and pinned quality gates
        run: cargo xtask tooling-probe
      - name: Check coverage, CRAP and changed shipped source
        run: cargo xtask mutate
