[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json.workspace = true
sha2.workspace = true
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tempfile = "3"
climon2-core = { path = "../crates/climon2-core" }
climon2-platform = { path = "../crates/climon2-platform" }

# Windows runs the source check, the native-only quality gate and dist
# (docs/for-humans/windows/quality.md); the other release commands need the Unix
# installer.
[target.'cfg(unix)'.dependencies]
climon2-install = { path = "../crates/climon2-install" }
libc = "0.2.191"

# The Windows dist ships the ConPTY files the harness fetches and verifies
# against pins/conpty.txt, so both take them from one place.
[target.'cfg(windows)'.dependencies]
climon2-test-term = { path = "../crates/climon2-test-term" }

# The Windows dist's tests check its archive against what the installer installs.
[target.'cfg(windows)'.dev-dependencies]
climon2-install = { path = "../crates/climon2-install" }

# The fixtures' stand-ins are Unix programs.
[target.'cfg(unix)'.dev-dependencies]
climon2-fixtures = { path = "../crates/climon2-fixtures" }

[dev-dependencies]
# Only so that Cargo builds the second-release fixture's library (#97).
climon2-second-release = { path = "../crates/climon2-second-release" }
serde.workspace = true
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[lints]
workspace = true
